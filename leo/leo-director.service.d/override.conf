# Drop-in for leo-director.service - install once:
#   mkdir -p ~/.config/systemd/user/leo-director.service.d
#   cp <repo>/leo/leo-director.service.d/override.conf ~/.config/systemd/user/leo-director.service.d/
#   systemctl --user daemon-reload && systemctl --user restart leo-director
# Then 'botcmd master set <ACCOUNT>' can rotate the master account by editing
# ~/.director.env - no unit edits needed.
[Service]
EnvironmentFile=%h/.director.env
